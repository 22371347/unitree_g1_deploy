seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 50000
empirical_normalization: false
obs_groups: {}
clip_actions: null
save_interval: 500
experiment_name: unitree_g1_29dof_boxing_push_recovery
run_name: push_recovery_v02
logger: wandb
neptune_project: isaaclab
wandb_project: isaaclab
resume: true
load_run: 2026-08-12_11-37-31_push_recovery_v01
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
policy:
  class_name: ActorCritic
  init_noise_std: 0.5
